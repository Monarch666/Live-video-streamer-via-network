<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f17">
  <title>Live Video Relay Dashboard</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="title-row">
        <span class="status-dot-title"></span>
        <h1 class="main-title">Live Video Relay Dashboard</h1>
      </div>
      <p class="subtitle">Multi-View Streaming console</p>
    </header>

    <!-- Control Bar -->
    <div class="add-feed-bar">
      <input type="text" id="streamUrlInput" class="input-url" placeholder="Paste TryCloudflare or LAN stream URL (e.g. https://xxx.trycloudflare.com)">
      <input type="text" id="streamNameInput" class="input-name" placeholder="Camera Name (e.g. Side Gate)">
      <button id="addFeedBtn" class="btn-add">
        <i class="fa-solid fa-plus"></i> Add Feed
      </button>
    </div>

    <!-- Video Feeds Grid -->
    <main id="feedsGrid" class="feeds-grid">
      <!-- Dynamic stream cards inserted here -->
    </main>

    <!-- Footer -->
    <footer class="dashboard-footer">
      Live Video Relay — powered by Cloudflare Tunnel
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
